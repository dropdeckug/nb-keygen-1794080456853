name: Generate Keystore
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  actions: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore             -alias "release-key" -keyalg RSA -keysize 2048 -validity 10000             -storepass "12345a" -keypass "12345a"             -dname "CN=NativeBinary, O=NativeBinary, L=Unknown, ST=Unknown, C=US"
          echo "=== Keystore generated ==="
          echo "=== FINGERPRINTS_START ==="
          keytool -list -v -keystore release.keystore -storepass "12345a" 2>&1
          echo "=== FINGERPRINTS_END ==="
          base64 -w 0 release.keystore > keystore.b64
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: generated-keystore
          path: keystore.b64
          retention-days: 7
